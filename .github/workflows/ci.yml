name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore PlakaTanimaliOtoparkOtomasyonu.sln --locked-mode

      - name: Build Release
        run: dotnet build PlakaTanimaliOtoparkOtomasyonu.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PlakaTanimaliOtoparkOtomasyonu.sln --configuration Release --no-build --logger "console;verbosity=normal"

  python:
    name: Python validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: PythonPlateReader

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: PythonPlateReader/requirements-dev.txt

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip setuptools && python -m pip install --requirement requirements-dev.txt

      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --no-deps --disable-pip

      - name: Compile Python sources
        run: python -m compileall -q app.py core.py tests

      - name: Lint and format check
        run: python -m ruff check . && python -m ruff format --check .

      - name: Run validation tests
        run: python -m pytest tests -q
